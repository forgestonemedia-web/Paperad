<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Model Placement</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        height: 100%;
        background: #D3D3D3;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, sans-serif;
      }
      #brand-screen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #D3D3D3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #brand-logo {
        width: 80vw;
        max-width: 380px;
        margin-bottom: 30px;
      }
      #ar-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #D0021B;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
        min-width: 220px;
        height: 56px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      #ar-hint {
        margin-top: 14px;
        color: #555;
        font-size: 0.85rem;
        text-align: center;
        max-width: 240px;
      }
    </style>
  </head>
  <body>
    <div id="brand-screen">
      <img id="brand-logo" src="media/logo.png" alt="Logo">
      <!--
        This is Apple's native AR Quick Look trigger: a plain link to a .usdz
        file with rel="ar". No JavaScript library needed \u2014 Safari on iOS
        recognizes this pattern automatically and opens the AR viewer.
      -->
      <a id="ar-link" href="media/usdz/model.usdz" rel="ar">START AR</a>
      <div id="ar-hint">Tap the cube icon (top right) to view in your space</div>
    </div>
  </body>
</html>
