<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Model Placement</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        height: 100%;
        background: #D3D3D3;
      }
      #brand-screen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #D3D3D3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #brand-logo {
        width: 60vw;
        max-width: 260px;
      }
    </style>
  </head>
  <body>
    <div id="brand-screen">
      <img id="brand-logo" src="media/logo.png" alt="Logo">
    </div>
    <script>
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        window.location.replace('ios.html');
      } else {
        window.location.replace('android.html');
      }
    </script>
  </body>
</html>
